<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FoodieHub</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #fff7f2;
            color: #333;
            text-align: center;
        }

        /* Header */
        header {
            background-color: #ff5a1f;
            color: white;
            padding: 20px;
        }

        header h1 {
            margin: 0 0 10px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 10px;
            transition: 0.3s;
        }

        nav a:hover {
            color: #ffe0d2;
        }

        /* Main section */
        main {
            min-height: 75vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        /* Floating emoji */
        .food {
            font-size: 70px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {

            0% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-15px);
            }

            100% {
                transform: translateY(0);
            }

        }

        /* Welcome text */
        .welcome {
            animation: fadeIn 1.5s ease-in;
        }

        @keyframes fadeIn {

            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        h2 {
            font-size: 40px;
            color: #ff5a1f;
            margin-bottom: 10px;
        }

        p {
            font-size: 18px;
            color: #555;
        }

        /* Buttons */
        .buttons {
            margin-top: 25px;
        }

        .buttons a {
            display: inline-block;
            background-color: #ff5a1f;
            color: white;
            text-decoration: none;
            padding: 12px 25px;
            margin: 8px;
            border-radius: 25px;
            transition: 0.3s;
        }

        .buttons a:hover {
            background-color: #e64b15;
            transform: scale(1.08);
        }

        /* Footer */
        footer {
            background-color: #222;
            color: white;
            padding: 15px;
        }

        footer p {
            color: white;
            font-size: 14px;
        }

    </style>

</head>

<body>

    <!-- Header -->

    <header>

        <h1>🍔 FoodieHub</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
            <a href="signup.html">Sign Up</a>
        </nav>

    </header>


    <!-- Welcome Section -->

    <main>

        <div class="food">
            🍕
        </div>

        <div class="welcome">

            <h2>Welcome to FoodieHub!</h2>

            <p>
                Your favourite food, just a click away.
            </p>

            <p>
                Discover delicious meals and enjoy
                a simple food ordering experience.
            </p>

        </div>


        <!-- Buttons -->

        <div class="buttons">

            <a href="login.html">
                Login
            </a>

            <a href="signup.html">
                Sign Up
            </a>

        </div>

    </main>


    <!-- Footer -->

    <footer>

        <p>© 2026 FoodieHub | All Rights Reserved</p>

    </footer>

</body>

</html>

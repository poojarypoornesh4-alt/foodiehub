<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FoodieHub - Sign Up</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #fff7f2;
            color: #333;
        }

        /* Header */

        header {
            background-color: #ff5a1f;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0 0 10px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 10px;
            transition: 0.3s;
        }

        nav a:hover {
            color: #ffe0d2;
        }

        /* Sign Up Box */

        main {
            min-height: 75vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .signup-box {
            background-color: white;
            width: 380px;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);

            animation: slideUp 0.8s ease;
        }

        @keyframes slideUp {

            from {
                opacity: 0;
                transform: translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        .signup-icon {
            font-size: 50px;
            text-align: center;
            animation: float 2.5s ease-in-out infinite;
        }

        @keyframes float {

            0% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }

            100% {
                transform: translateY(0);
            }

        }

        h2 {
            text-align: center;
            color: #ff5a1f;
            margin-bottom: 25px;
        }

        /* Form */

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #ff5a1f;
            box-shadow: 0 0 5px rgba(255, 90, 31, 0.3);
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            border: none;
            border-radius: 25px;
            background-color: #ff5a1f;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #e64b15;
            transform: scale(1.03);
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        .login-link a {
            color: #ff5a1f;
            text-decoration: none;
            font-weight: bold;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        /* Footer */

        footer {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 15px;
        }

        footer p {
            margin: 0;
            font-size: 14px;
        }

    </style>

</head>

<body>

    <!-- Header -->

    <header>

        <h1>🍔 FoodieHub</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
            <a href="signup.html">Sign Up</a>
        </nav>

    </header>


    <!-- Sign Up Form -->

    <main>

        <div class="signup-box">

            <div class="signup-icon">
                🍕
            </div>

            <h2>Create Your Account</h2>

            <form>

                <label for="name">Full Name</label>
                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    required
                >

                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    required
                >

                <label for="confirm-password">Confirm Password</label>
                <input
                    type="password"
                    id="confirm-password"
                    placeholder="Confirm your password"
                    required
                >

                <button type="submit">
                    Create Account
                </button>

            </form>

            <div class="login-link">

                <p>
                    Already have an account?
                    <a href="login.html">Login</a>
                </p>

            </div>

        </div>

    </main>


    <!-- Footer -->

    <footer>

        <p>© 2026 FoodieHub | All Rights Reserved</p>

    </footer>

</body>

</html>
